name: AlphaPass CI/CD Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── STAGE 1: AUTOMATED UNIT & INTEGRATION TESTING ───────────────────────────
  test:
    name: Run Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute pytest Suite
        run: |
          cd backend
          pytest -v

  # ── STAGE 2: BUILD & PACKAGE LAMBDA ARTIFACT ─────────────────────────────────
  package:
    name: Package Backend Lambda Artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lambda deployment package
        run: |
          # Install production deps into a clean build directory (NOT into backend/)
          # Exclude dev/test packages and AWS SDK (provided by Lambda runtime)
          mkdir -p lambda_build
          pip install \
            --target lambda_build/ \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --implementation cp \
            --python-version 3.12 \
            --upgrade \
            -r backend/requirements.txt

          # Remove packages already provided by the Lambda runtime or only needed for tests
          rm -rf lambda_build/boto3* lambda_build/botocore* lambda_build/s3transfer* \
                 lambda_build/jmespath* lambda_build/urllib3* lambda_build/moto* \
                 lambda_build/pytest* lambda_build/httpx* lambda_build/responses* \
                 lambda_build/async_timeout* lambda_build/werkzeug* \
                 lambda_build/jinja2* lambda_build/markupsafe*

          # Remove bytecode to keep the zip small
          find lambda_build -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find lambda_build -name "*.pyc" -delete 2>/dev/null || true

          # Copy application source
          cp -r backend/app lambda_build/
          cp backend/index.py lambda_build/

          # Create the zip artifact
          cd lambda_build && zip -r ../lambda_package.zip . -q
          cd ..
          echo "Lambda package size: $(du -sh lambda_package.zip | cut -f1)"

      - name: Upload Lambda zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: lambda_package.zip
          retention-days: 1

  # ── STAGE 3: INFRASTRUCTURE & FRONTEND DEPLOYMENT ──────────────────────────
  deploy:
    needs: [test, package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TF_VAR_ses_sender_email: ${{ secrets.SES_SENDER_EMAIL || 'noreply@alphapass.alphateam.live' }}
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::AWS credentials secrets are not set."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Lambda zip artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Pre-Deploy Sanitation (S3 bucket & AWS Budget only — data is preserved)
        run: |
          echo "=== Pre-Deploy Sanitation (non-destructive to data) ==="
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          ENV="dev"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)

          # Clear S3 bucket contents so Terraform can recreate/update it cleanly
          # (versioned objects block bucket deletion; this does NOT delete DynamoDB data)
          BUCKET_NAME="alphapass.alphateam.live"
          if aws s3api head-bucket --bucket "$BUCKET_NAME" --region "$REGION" 2>/dev/null; then
            echo "Clearing S3 bucket $BUCKET_NAME contents before sync..."
            aws s3 rm "s3://$BUCKET_NAME" --recursive 2>/dev/null || true

            VERSIONS=$(aws s3api list-object-versions --bucket "$BUCKET_NAME" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null || true)
            if [ -n "$VERSIONS" ] && [ "$VERSIONS" != '{"Objects": null}' ] && [ "$VERSIONS" != '{"Objects": []}' ]; then
              aws s3api delete-objects --bucket "$BUCKET_NAME" --delete "$VERSIONS" 2>/dev/null || true
            fi

            MARKERS=$(aws s3api list-object-versions --bucket "$BUCKET_NAME" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null || true)
            if [ -n "$MARKERS" ] && [ "$MARKERS" != '{"Objects": null}' ] && [ "$MARKERS" != '{"Objects": []}' ]; then
              aws s3api delete-objects --bucket "$BUCKET_NAME" --delete "$MARKERS" 2>/dev/null || true
            fi

            aws s3api delete-bucket --bucket "$BUCKET_NAME" --region "$REGION" 2>/dev/null || true
          fi

          # Remove AWS Budget to avoid DuplicateRecordException on re-apply
          BUDGET_NAME="alphapass-free-tier-budget-${ENV}"
          if [ -n "$ACCOUNT_ID" ]; then
            if aws budgets describe-budget --account-id "$ACCOUNT_ID" --budget-name "$BUDGET_NAME" 2>/dev/null; then
              aws budgets delete-budget --account-id "$ACCOUNT_ID" --budget-name "$BUDGET_NAME" 2>/dev/null || true
            fi
          fi

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: |
          cd infra
          terraform init
          # Import S3 bucket into state if it already exists (idempotent)
          terraform import module.s3.aws_s3_bucket.frontend alphapass.alphateam.live 2>/dev/null || true

      - name: Generate SECRET_KEY
        id: secret_key
        run: echo "value=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> $GITHUB_OUTPUT

      - name: Terraform Plan
        run: |
          cd infra
          terraform plan \
            -var="environment=dev" \
            -var="secret_key=${{ steps.secret_key.outputs.value }}" \
            -var="ses_sender_email=${TF_VAR_ses_sender_email}"

      - name: Terraform Apply
        run: |
          cd infra
          terraform apply \
            -var="environment=dev" \
            -var="secret_key=${{ steps.secret_key.outputs.value }}" \
            -var="ses_sender_email=${TF_VAR_ses_sender_email}" \
            -auto-approve

      - name: Deploy Backend Lambda code
        run: |
          cd infra
          LAMBDA_NAME=$(terraform output -raw lambda_function_name)
          echo "Deploying Lambda package to: $LAMBDA_NAME"
          aws lambda update-function-code \
            --function-name "$LAMBDA_NAME" \
            --zip-file "fileb://../lambda_package.zip"
          # Wait for the update to complete before proceeding
          aws lambda wait function-updated --function-name "$LAMBDA_NAME"
          echo "Lambda deployment complete."

      - name: Deploy Frontend to S3
        run: |
          cd infra
          BUCKET_NAME=$(terraform output -raw frontend_bucket_name)
          API_URL=$(terraform output -raw api_endpoint)
          FRONTEND_URL=$(terraform output -raw frontend_website_endpoint)
          LAMBDA_NAME=$(terraform output -raw lambda_function_name)

          echo "S3 Bucket: $BUCKET_NAME"
          echo "API Endpoint: $API_URL"

          # Inject live API Gateway URL into config.js from template
          DEPLOY_TS=$(date -u +%Y%m%d%H%M%S)
          export API_URL DEPLOY_TS
          envsubst '${API_URL} ${DEPLOY_TS}' < ../frontend/js/config.template.js > ../frontend/js/config.js
          echo "config.js written with API_URL=${API_URL}"

          # Bump cache-buster version in all HTML files
          find ../frontend -maxdepth 1 -name "*.html" \
            -exec sed -i "s|js/config\.js?v=[^'\"]*|js/config.js?v=${DEPLOY_TS}|g" {} +
          echo "Cache-buster updated to v=${DEPLOY_TS}"

          aws s3 sync ../frontend/ s3://$BUCKET_NAME --delete --cache-control "max-age=3600,public"

          echo "### AlphaPass Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend URL:** [http://$FRONTEND_URL](http://$FRONTEND_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint:** \`$API_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda Function:** \`$LAMBDA_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** \`$BUCKET_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Deployment Complete::Frontend: http://$FRONTEND_URL | API: $API_URL"


